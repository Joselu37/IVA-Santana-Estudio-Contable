<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Logo Icon & Text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E5A1" />
      <stop offset="35%" stop-color="#E2BA65" />
      <stop offset="70%" stop-color="#C29438" />
      <stop offset="100%" stop-color="#F3D580" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5DB94" />
      <stop offset="100%" stop-color="#D19E37" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Stylized Santana 'S' Ribbon Icon -->
    <g transform="translate(10, 0)">
      <!-- Top Ribbon Branch -->
      <path d="M 45,5 C 20,20 15,45 35,60 C 50,70 55,85 35,95 L 45,98 C 70,80 65,55 45,40 C 30,30 28,18 45,5 Z" fill="url(#goldGrad)" />
      <!-- Middle Arrow Accent -->
      <path d="M 50,0 L 65,15 L 48,22 C 35,32 32,46 45,55 C 55,62 60,75 42,90 L 52,95 C 72,78 68,52 48,38 C 36,30 38,15 50,0 Z" fill="url(#goldGrad)" />
      <!-- Lower Base Curve -->
      <path d="M 15,95 C 25,82 38,75 48,78 C 35,88 25,92 5,100 Z" fill="url(#goldGrad)" opacity="0.9" />
    </g>

    <!-- Brand Typography: SANTANA -->
    <g transform="translate(95, 45)" fill="url(#goldGrad)">
      <!-- Custom Geometric S -->
      <path d="M 28,3 C 14,3 4,9 4,20 C 4,32 18,34 26,38 C 34,42 34,48 24,50 C 14,50 6,44 4,38 L 0,44 C 4,52 14,56 26,56 C 40,56 46,47 46,37 C 46,24 32,22 24,18 C 16,14 16,9 26,9 C 34,9 40,13 42,18 L 46,12 C 42,4 34,3 28,3 Z" />
      <!-- Custom Geometric A (no crossbar like image: Λ) -->
      <path d="M 55,56 L 68,3 L 74,3 L 87,56 L 79,56 L 71,22 L 63,56 Z" />
      <!-- Custom N -->
      <path d="M 96,56 L 96,3 L 104,3 L 120,42 L 120,3 L 127,3 L 127,56 L 119,56 L 103,16 L 103,56 Z" />
      <!-- Custom T -->
      <path d="M 134,9 L 148,9 L 148,56 L 156,56 L 156,9 L 170,9 L 170,3 L 134,3 Z" />
      <!-- Custom Geometric A (Λ) -->
      <path d="M 177,56 L 190,3 L 196,3 L 209,56 L 201,56 L 193,22 L 185,56 Z" />
      <!-- Custom N -->
      <path d="M 218,56 L 218,3 L 226,3 L 242,42 L 242,3 L 249,3 L 249,56 L 241,56 L 225,16 L 225,56 Z" />
      <!-- Custom Geometric A (Λ) -->
      <path d="M 259,56 L 272,3 L 278,3 L 291,56 L 283,56 L 275,22 L 267,56 Z" />
    </g>

    <!-- Subtitle: ESTUDIO CONTABLE -->
    <text x="96" y="85" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="url(#goldLight)">
      ESTUDIO CONTABLE
    </text>
  </g>
</svg>
